name: OrçaPro CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check authenticated test script syntax
        run: node --check test/e2e/supabase-real-authenticated.mjs
      - name: Typecheck
        run: npm run lint
      - name: Logic tests
        run: npm run test:logic
      - name: Production build
        run: npm run build
